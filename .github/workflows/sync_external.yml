name: Sync External Cores

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Scan all dev repos
        run: |
          DEVS=(
            "kuzearcade/Arcade-GingaNin_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-JalecoMS1BCD_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-NamcoSystem2_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-NMK16_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-NMKBP964_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-SandScrp_MiSTer/main:KuzeArcade"
            "meathax/meatcores/main:Meathax"
          )

          # Wipe only the auto-generated section, preserve manual entries
          python3 -c "
          import re
          with open('external_files.csv', 'r') as f:
              content = f.read()
          content = re.sub(
              r'# === AUTO-GENERATED ===.*?# === END AUTO-GENERATED ===\n?',
              '',
              content,
              flags=re.DOTALL
          )
          with open('external_files.csv', 'w') as f:
              f.write(content)
          "

          echo "# === AUTO-GENERATED ===" >> external_files.csv

          for entry in "${DEVS[@]}"; do
            IFS=':' read -r repo_spec target_folder <<< "$entry"
            IFS='/' read -r owner repo branch <<< "$repo_spec"

            # --- Part 1: Scan repo tree for .rbf and .mra files ---
            curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$owner/$repo/git/trees/$branch?recursive=1" \
              | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          tree = data.get('tree', [])
          owner, repo, branch = '$owner', '$repo', '$branch'
          target_folder = '$target_folder'
          lines = []
          for item in tree:
              if item['type'] != 'blob':
                  continue
              path = item['path']
              url = f'https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{path}'
              if path.endswith('.rbf'):
                  filename = path.split('/')[-1]
                  lines.append(f'{url},_Arcade/cores/{filename}')
              elif path.endswith('.mra'):
                  stripped = path
                  if stripped.startswith('_Arcade/'):
                      stripped = stripped[len('_Arcade/'):]
                  lines.append(f'{url},_Arcade/Unofficial/{target_folder}/{stripped}')
          print('\n'.join(lines))
          " >> external_files.csv

            # --- Part 2: Pull .zip ROMs from dev's external_files.csv ---
            curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://raw.githubusercontent.com/$owner/$repo/$branch/external_files.csv" \
              | python3 -c "
          import sys, re

          url_pattern = re.compile(r'^https?://')

          for line in sys.stdin:
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              parts = [p.strip() for p in line.split(',')]

              url = None
              path = None
              for p in parts:
                  if url_pattern.match(p):
                      url = p
                  elif p.endswith('.zip'):
                      path = p

              if url and path:
                  print(f'{path},{url}')
              elif url and not path:
                  filename = url.split('/')[-1].split('?')[0]
                  if filename.endswith('.zip'):
                      print(f'games/mame/{filename},{url}')
          " >> external_files.csv
          done

          echo "# === END AUTO-GENERATED ===" >> external_files.csv

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add external_files.csv
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync: updated external_files.csv"
            git push
          fi   
