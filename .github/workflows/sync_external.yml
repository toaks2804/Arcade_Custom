name: Sync External Cores

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Scan all dev repos
        run: |
          DEVS=(
            "kuzearcade/Arcade-GingaNin_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-JalecoMS1BCD_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-NamcoSystem2_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-NMK16_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-NMKBP964_MiSTer/main:KuzeArcade"
            "kuzearcade/Arcade-SandScrp_MiSTer/main:KuzeArcade"
            "meathax/meatcores/main:Meathax"
            "blahm1d/blahm1d-cores/main:Blahm1d"
          )

          > external_files.csv
          > /tmp/download_files.txt

          for entry in "${DEVS[@]}"; do
            IFS=':' read -r repo_spec target_folder <<< "$entry"
            IFS='/' read -r owner repo branch <<< "$repo_spec"

            curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$owner/$repo/git/trees/$branch?recursive=1" \
              | python3 -c "
          import sys, json
          from urllib.parse import quote

          data = json.load(sys.stdin)
          tree = data.get('tree', [])
          owner, repo, branch = '$owner', '$repo', '$branch'
          target_folder = '$target_folder'
          lines = []
          download_files = []
          for item in tree:
              if item['type'] != 'blob':
                  continue
              path = item['path']
              url = f'https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{quote(path, safe=\"/\")}'
              safe_path = path.replace(',', ' ')
              if path.endswith('.rbf'):
                  filename = path.split('/')[-1].replace(',', ' ')
                  lines.append(f'_Arcade/cores/{filename},{url}')
              elif path.endswith('.mra') or path.endswith('.nvm'):
                  stripped = safe_path
                  if stripped.startswith('_Arcade/'):
                      stripped = stripped[len('_Arcade/'):]
                  if stripped.startswith('config/'):
                      local_path = stripped
                  else:
                      if '/' in stripped:
                          stripped = stripped.split('/', 1)[1]
                      local_path = f'_Arcade/Unofficial/{target_folder}/{stripped}'
                      parts = local_path.split('/')
                      for i in range(len(parts) - 1):
                          if not parts[i].startswith('_'):
                              parts[i] = '_' + parts[i]
                      local_path = '/'.join(parts)
                  download_files.append((local_path, url))
          print('\n'.join(lines))
          with open('/tmp/download_files.txt', 'a') as f:
              for local_path, url in download_files:
                  f.write(f'{local_path}|{url}\n')
          " >> external_files.csv

            curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://raw.githubusercontent.com/$owner/$repo/$branch/external_files.csv" \
              | python3 -c "
          import sys, re

          url_pattern = re.compile(r'^https?://')

          for line in sys.stdin:
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              parts = [p.strip() for p in line.split(',')]

              url = None
              path = None
              for p in parts:
                  if url_pattern.match(p):
                      url = p
                  elif p.endswith('.zip'):
                      path = p

              if url and path:
                  print(f'{path},{url}')
              elif url and not path:
                  filename = url.split('/')[-1].split('?')[0]
                  if filename.endswith('.zip'):
                      print(f'games/mame/{filename},{url}')
          " >> external_files.csv
          done

          if [ -f /tmp/download_files.txt ]; then
            while IFS='|' read -r local_path url; do
              [ -z "$local_path" ] && continue
              mkdir -p "$(dirname "$local_path")"
              curl -sL -o "$local_path" "$url"
            done < /tmp/download_files.txt
          fi

          if [ -f manual_external_files.csv ]; then
            cat manual_external_files.csv >> external_files.csv
          fi

      - name: Auto-discover MAME ROMs from MRA files
        run: |
          python3 << 'EOF'
          import os, json, time, xml.etree.ElementTree as ET
          from urllib.parse import quote
          from urllib.request import urlopen

          ARCHIVE_BASE = "https://archive.org/download/mame-roms-merged_/MAME%20ROMs%20%28merged%29"
          ARCHIVE_API = "https://archive.org/metadata/mame-roms-merged_/files"

          # Load existing entries from external_files.csv
          existing = set()
          with open('external_files.csv') as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith('#'):
                      parts = line.split(',')
                      if len(parts) >= 2:
                          existing.add(parts[0].lower())

          # Find all .mra files and extract ROM names
          roms_needed = set()
          for root, dirs, files in os.walk('_Arcade'):
              for fname in files:
                  if fname.endswith('.mra'):
                      mra_path = os.path.join(root, fname)
                      try:
                          tree = ET.parse(mra_path)
                          root_elem = tree.getroot()
                          for rom_elem in root_elem.iter('rom'):
                              rom_name = rom_elem.text.strip()
                              if rom_name and rom_name.endswith('.zip'):
                                  roms_needed.add(rom_name)
                      except ET.ParseError:
                          pass

          print(f"Found {len(roms_needed)} unique ROMs referenced in MRA files.")

          # Check which ones are already in external_files.csv
          new_roms = []
          for rom in sorted(roms_needed):
              local_path = f'games/mame/{rom}'
              if local_path.lower() not in existing:
                  new_roms.append(rom)

          print(f"{len(new_roms)} ROMs not yet in external_files.csv.")

          # Wipe missing_roms.csv each run
          with open('missing_roms.csv', 'w') as f:
              pass

          # Fetch archive.org metadata for new ROMs
          ia_cache = {}
          added = 0
          failed = 0

          for rom in new_roms:
              if rom in ia_cache:
                  size, md5 = ia_cache[rom]
              else:
                  api_url = f"{ARCHIVE_API}/{quote(rom)}"
                  try:
                      with urlopen(api_url, timeout=10) as resp:
                          data = json.loads(resp.read())
                      result = data.get('result', {})
                      size = result.get('size')
                      md5 = result.get('md5')
                      ia_cache[rom] = (size, md5)
                  except Exception:
                      size, md5 = None, None
                  time.sleep(0.1)

              if size and md5:
                  url = f"{ARCHIVE_BASE}/{quote(rom)}"
                  with open('external_files.csv', 'a') as f:
                      f.write(f"games/mame/{rom},{url},{size},{md5}\n")
                  added += 1
                  print(f"  + {rom}")
              else:
                  failed += 1
                  with open('missing_roms.csv', 'a') as f:
                      f.write(f"{rom}\n")
                  print(f"  ! {rom} (not found on archive.org)")

          print(f"\nAdded {added} ROMs, {failed} missing.")
          EOF

      - name: Enrich missing hashes and sizes
        run: |
          python3 << 'EOF'
          import json, os, sys, time, hashlib, tempfile
          from urllib.parse import quote, urlparse
          from urllib.request import urlopen

          def get_ia_metadata(url):
              parsed = urlparse(url)
              parts = parsed.path.split('/', 2)
              if len(parts) < 3:
                  return None, None
              remainder = parts[2]
              if '/' not in remainder:
                  return None, None
              idx = remainder.index('/')
              identifier = remainder[:idx]
              file_path = remainder[idx+1:]
              api_url = f"https://archive.org/metadata/{identifier}/files/{quote(file_path, safe='/')}"
              try:
                  with urlopen(api_url, timeout=10) as resp:
                      data = json.loads(resp.read())
                  result = data.get('result', {})
                  return result.get('size'), result.get('md5')
              except Exception:
                  return None, None

          def get_file_metadata(url):
              try:
                  tmp = tempfile.NamedTemporaryFile(delete=False)
                  with urlopen(url, timeout=30) as resp:
                      while True:
                          chunk = resp.read(65536)
                          if not chunk:
                              break
                          tmp.write(chunk)
                  tmp.close()
                  with open(tmp.name, 'rb') as f:
                      data = f.read()
                  os.unlink(tmp.name)
                  return str(len(data)), hashlib.md5(data).hexdigest()
              except Exception:
                  return None, None

          infile = 'external_files.csv'
          out_lines = []
          enriched = 0
          failed = 0

          with open(infile) as f:
              for line in f:
                  line = line.rstrip('\n')
                  if not line or line.startswith('#'):
                      out_lines.append(line)
                      continue
                  parts = line.split(',')
                  if len(parts) >= 4 and parts[2] and parts[3]:
                      out_lines.append(line)
                      continue
                  if len(parts) < 2:
                      out_lines.append(line)
                      continue
                  path, url = parts[0], parts[1]
                  size, md5 = None, None
                  if 'archive.org' in url:
                      size, md5 = get_ia_metadata(url)
                      time.sleep(0.2)
                  if not size:
                      size, md5 = get_file_metadata(url)
                  if size and md5:
                      out_lines.append(f"{path},{url},{size},{md5}")
                      enriched += 1
                  else:
                      out_lines.append(line)
                      failed += 1

          with open(infile, 'w') as f:
              f.write('\n'.join(out_lines) + '\n')

          print(f"Enriched {enriched} entries, {failed} failed.")
          EOF

      - name: Commit and trigger build
        id: commit_and_trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add external_files.csv
          git add missing_roms.csv 2>/dev/null || true
          git add _Arcade/ 2>/dev/null || true
          git add config/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to sync. Skipping build_db."
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync: updated external_files.csv and core files"
            git push
            echo "should_trigger=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger build_db workflow
        if: steps.commit_and_trigger.outputs.should_trigger == 'true'
        run: |
          gh workflow run "Build Custom Database" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
