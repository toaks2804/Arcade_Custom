name: Sync External Cores

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Scan all dev repos
        run: |
          DEVS=(
            "kuzearcade/kuzecores/main:KuzeArcade"
            "meathax/meatcores/main:Meathax"
          )

          > external_files.csv

          for entry in "${DEVS[@]}"; do
            IFS=':' read -r repo_spec target_folder <<< "$entry"
            IFS='/' read -r owner repo branch <<< "$repo_spec"

            # --- Part 1: Scan repo tree for .rbf and .mra files ---
            curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$owner/$repo/git/trees/$branch?recursive=1" \
              | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          tree = data.get('tree', [])
          owner, repo, branch = '$owner', '$repo', '$branch'
          target_folder = '$target_folder'
          lines = []
          for item in tree:
              if item['type'] != 'blob':
                  continue
              path = item['path']
              url = f'https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{path}'
              if path.endswith('.rbf'):
                  filename = path.split('/')[-1]
                  lines.append(f'{url},_Arcade/cores/{filename}')
              elif path.endswith('.mra'):
                  lines.append(f'{url},_Arcade/Unofficial/{target_folder}/{path}')
          print('\n'.join(lines))
          " >> external_files.csv
          
            # --- Part 2: Pull in the dev's own external_files.csv (archive.org etc.) ---
            curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://raw.githubusercontent.com/$owner/$repo/$branch/external_files.csv" \
              | python3 -c "
          import sys
          target_folder = '$target_folder'
          for line in sys.stdin:
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              parts = line.rsplit(',', 1)
              if len(parts) == 2:
                  url, original_path = parts
                  # Remap target path to your structure
                  filename = original_path.split('/')[-1]
                  if filename.endswith('.rbf'):
                      new_path = f'_Arcade/cores/{filename}'
                  else:
                      new_path = f'_Arcade/Unofficial/{target_folder}/{original_path}'
                  print(f'{url},{new_path}')
              else:
                  # Single-column entry (just a URL, no target path)
                  filename = line.split('/')[-1]
                  if filename.endswith('.rbf'):
                      print(f'{line},_Arcade/cores/{filename}')
                  else:
                      print(f'{line},_Arcade/Unofficial/{target_folder}/{filename}')
          " >> external_files.csv
          done

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add external_files.csv
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync: updated external_files.csv"
            git push
          fi
