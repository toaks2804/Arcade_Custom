name: Sync External Cores

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Scan all dev repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import csv
          import json
          import os
          import re
          import shutil
          import sys
          from collections import defaultdict
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          DEVS = [
              ("kuzearcade", "Arcade-GingaNin_MiSTer", "main", "KuzeArcade"),
              ("kuzearcade", "Arcade-JalecoMS1BCD_MiSTer", "main", "KuzeArcade"),
              ("kuzearcade", "Arcade-NamcoSystem2_MiSTer", "main", "KuzeArcade"),
              ("kuzearcade", "Arcade-NMK16_MiSTer", "master", "KuzeArcade"),
              ("kuzearcade", "Arcade-NMKBP964_MiSTer", "main", "KuzeArcade"),
              ("kuzearcade", "Arcade-SandScrp_MiSTer", "main", "KuzeArcade"),
              ("meathax", "meatcores", "main", "Meathax"),
              ("blahm1d", "MiSTer-cores", "main", "Blahm1d"),
              ("Gm0rk", "Arcade-Atari-G1_MiSTer", "main", "Gm0rk"),
              ("XelaNotPu", "BreakThru_MiSTer", "main", "XelaNotPu"),
              ("XelaNotPu", "ZN1_MiSTer", "main", "XelaNotPu"),
              ("XelaNotPu", "ZN1-TaitoFX1B_MiSTer", "main", "XelaNotPu"),
              ("XelaNotPu", "SYSTEM12_MiSTer", "main", "XelaNotPu"),
              ("XelaNotPu", "ZN1-Capcom_MiSTer", "main", "XelaNotPu"),
              ("XelaNotPu", "ZN2-Capcom_MiSTer", "main", "XelaNotPu"),
              ("XelaNotPu", "SYSTEM11_MiSTer-Supporter", "main", "XelaNotPu"),
              ("XelaNotPu", "SYSTEMFL_MiSTer-Supporter", "main", "XelaNotPu"),
              ("rmonic79", "rmcores", "main", "rmonic79"),
              ("decoryah", "Arcade-JackieChan_MiSTer", "","decoryah"),
          ]
          TOKEN = os.environ["GITHUB_TOKEN"]
          headers = {"Accept": "application/vnd.github+json", "Authorization": f"Bearer {TOKEN}", "X-GitHub-Api-Version": "2022-11-28"}

          def get_bytes(url, api=False):
              req = Request(url, headers=headers if api else {"User-Agent": "Arcade-Custom-Sync"})
              with urlopen(req, timeout=60) as response:
                  return response.read()

          def relative_source(path):
              # Return the path below the upstream repo's usual mra/ or _Arcade/ root.
              parts = path.replace("\\", "/").split("/")
              lower = [part.lower() for part in parts]
              for marker in ("mra", "_arcade", "arcade"):
                  if marker in lower:
                      parts = parts[lower.index(marker) + 1:]
                      break
              return parts

          def destination(path, kind, dev):
              filename = path.rsplit("/", 1)[-1]
              if kind == "rbf":
                  # Route to the console destination only when the upstream source
                  # path contains a folder named _Console (case-insensitive).
                  source_parts = path.replace("\\", "/").split("/")
                  if any(part.casefold() == "_console" for part in source_parts[:-1]):
                      return f"_Console/{filename}"
                  return f"_Arcade/cores/{filename}"
              if kind == "nvm":
                  return f"config/nvram/{filename}"
              parts = relative_source(path)
              lower = [part.lower() for part in parts]
              if "_alternatives" in lower:
                  i = lower.index("_alternatives")
                  if i + 2 >= len(parts):
                      raise ValueError(f"Alternative MRA lacks a game folder: {path}")
                  game = parts[i + 1]
                  # Normalize to exactly one leading underscore, even if upstream has several.
                  game = "_" + game.lstrip("_")
                  return f"_Arcade/_Unofficial/_{dev}/_Alternatives/{game}/{filename}"
              # A few repositories keep a duplicate mirror in mra/_mra. Prefer
              # the primary MRA path, but retain the filename and developer folder.
              return f"_Arcade/_Unofficial/_{dev}/{filename}"

          old_manifest_path = "sync_manifest.txt"
          try:
              with open(old_manifest_path, encoding="utf-8") as f:
                  old_managed = {line.strip() for line in f if line.strip()}
          except FileNotFoundError:
              old_managed = set()

          candidates = defaultdict(list)
          external_lines = []
          for owner, repo, preferred_branch, dev in DEVS:
              # Prefer the configured branch (usually main), then try main/master,
              # and finally the repository's declared default branch. This handles
              # upstreams that rename main to master or use a custom default branch.
              repo_api = f"https://api.github.com/repos/{owner}/{repo}"
              try:
                  repo_info = json.loads(get_bytes(repo_api, api=True))
              except Exception as exc:
                  raise RuntimeError(f"Unable to read repository metadata for {owner}/{repo}: {exc}") from exc

              default_branch = repo_info.get("default_branch")
              branch_candidates = []
              for candidate in (preferred_branch, "main", "master", default_branch):
                  if candidate and candidate not in branch_candidates:
                      branch_candidates.append(candidate)

              tree = None
              branch = None
              branch_errors = []
              for candidate in branch_candidates:
                  api_url = f"https://api.github.com/repos/{owner}/{repo}/git/trees/{quote(candidate, safe='')}?recursive=1"
                  try:
                      tree = json.loads(get_bytes(api_url, api=True))
                      branch = candidate
                      break
                  except HTTPError as exc:
                      if exc.code == 404:
                          branch_errors.append(f"{candidate}: not found")
                          continue
                      raise RuntimeError(f"Unable to read tree for {owner}/{repo} on branch {candidate}: {exc}") from exc
                  except Exception as exc:
                      raise RuntimeError(f"Unable to read tree for {owner}/{repo} on branch {candidate}: {exc}") from exc

              if tree is None:
                  print(
                      f"WARNING: Skipping {owner}/{repo}; no usable branch found "
                      f"(tried {', '.join(branch_candidates)}; {', '.join(branch_errors)})."
                  )
                  continue
              print(f"Scanning {owner}/{repo} on branch {branch}.")
              if tree.get("truncated"):
                  raise RuntimeError(f"Git tree was truncated for {owner}/{repo}; refusing incomplete sync.")
              for item in tree.get("tree", []):
                  if item.get("type") != "blob":
                      continue
                  source = item["path"]
                  ext = source.lower().rsplit(".", 1)[-1] if "." in source else ""
                  if ext not in {"mra", "rbf", "nvm"}:
                      continue
                  # source/mra is a flattened build/source mirror in some XelaNotPu
                  # repositories. It loses the upstream _alternatives/_Gamename
                  # grouping, so only use the canonical release/_Arcade MRA tree.
                  if ext == "mra" and "/source/mra/" in ("/" + source.lower() + "/"):
                      continue
                  url = f"https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{quote(source, safe='/')}"
                  kind = ext
                  dest = destination(source, kind, dev)
                  # Prefer the primary MRA tree over mirrored mra/_mra copies.
                  score = 1 if "/_mra/" in ("/" + source.lower() + "/") else 0
                  candidates[dest].append((score, url, owner, repo, source, kind))

              raw_csv = f"https://raw.githubusercontent.com/{owner}/{repo}/{branch}/external_files.csv"
              try:
                  content = get_bytes(raw_csv).decode("utf-8-sig")
              except HTTPError as exc:
                  if exc.code == 404:
                      continue
                  raise RuntimeError(f"Unable to read {raw_csv}: {exc}") from exc
              for row in csv.reader(content.splitlines()):
                  if not row:
                      continue
                  parts = [part.strip() for part in row]
                  url = next((p for p in parts if p.startswith(("https://", "http://"))), None)
                  path = next((p for p in parts if p.lower().endswith(".zip")), None)
                  if url and path:
                      external_lines.append(f"{path},{url}")
                  elif url and url.split("?", 1)[0].lower().endswith(".zip"):
                      external_lines.append(f"games/mame/{url.split('/')[-1].split('?', 1)[0]},{url}")

          # Keep only the newest dated RBF for each core. The date is the final
          # underscore-delimited YYYYMMDD suffix; optional letters (for example, 20261019b)
          # distinguish revisions on the same date. Preserve the selected upstream filename.
          dated_rbf = re.compile(r"^(?P<core>.+)_(?P<date>\d{8})(?P<revision>[a-z]*)\.rbf$", re.IGNORECASE)
          latest_rbf = {}
          parsed_rbf = {}
          for dest, options in candidates.items():
              if options[0][5] != "rbf":
                  continue
              filename = dest.rsplit("/", 1)[-1]
              match = dated_rbf.match(filename)
              if not match:
                  continue
              # Keep arcade and console release histories independent even if a
              # developer happens to use the same core filename in both places.
              destination_group = "_console" if dest.startswith("_Console/") else "_arcade"
              core = (destination_group, match.group("core").casefold())
              version = (match.group("date"), match.group("revision").casefold())
              parsed_rbf[dest] = (core, version)
              if core not in latest_rbf or version > latest_rbf[core]:
                  latest_rbf[core] = version

          # Remove older dated releases, plus an undated copy if a dated release for
          # that exact core exists. Undated cores without a dated counterpart are kept.
          for dest, (core, version) in list(parsed_rbf.items()):
              if version < latest_rbf[core]:
                  latest_date, latest_revision = latest_rbf[core]
                  latest_suffix = latest_date + latest_revision
                  print(f"Skipping older RBF release {dest}; newest dated suffix is {latest_suffix}.rbf")
                  del candidates[dest]
          for dest, options in list(candidates.items()):
              if options[0][5] != "rbf":
                  continue
              filename = dest.rsplit("/", 1)[-1]
              if dated_rbf.match(filename):
                  continue
              stem = filename[:-4] if filename.lower().endswith(".rbf") else filename
              destination_group = "_console" if dest.startswith("_Console/") else "_arcade"
              core = (destination_group, stem.casefold())
              if core in latest_rbf:
                  latest_date, latest_revision = latest_rbf[core]
                  latest_suffix = latest_date + latest_revision
                  print(f"Skipping undated RBF {dest}; a dated release with suffix {latest_suffix}.rbf exists")
                  del candidates[dest]
          print(f"Selected newest dated RBF releases for {len(latest_rbf)} cores.")

          downloads = {}
          for dest, options in candidates.items():
              options.sort(key=lambda item: (item[0], item[2].lower(), item[3].lower(), item[4].lower()))
              # Keep the first primary path when repositories mirror an MRA in mra/_mra.
              selected = options[0]
              if len(options) > 1:
                  urls = {option[1] for option in options}
                  if len(urls) > 1 and selected[5] in {"rbf", "nvm"}:
                      # Some upstream repos mirror the same RBF in both
                      # _Arcade/cores/ and cores/. Prefer the canonical _Arcade copy
                      # only when all conflicting paths belong to the same repo.
                      canonical = [
                          option for option in options
                          if "/_arcade/cores/" in ("/" + option[4].lower() + "/")
                      ]
                      same_repo = len({
                          (option[2].lower(), option[3].lower()) for option in options
                      }) == 1
                      if selected[5] == "rbf" and canonical and same_repo:
                          selected = canonical[0]
                          print(
                              f"Using canonical RBF path {selected[4]} for {dest}; "
                              "ignoring mirrored copy."
                          )
                      else:
                          raise RuntimeError(
                              f"Destination collision for {dest}: "
                              + ", ".join(option[1] for option in options)
                          )
                  if len(urls) > 1 and selected[5] == "mra":
                      primary = [o for o in options if "/_mra/" not in ("/" + o[4].lower() + "/")]
                      if primary:
                          selected = primary[0]
              if selected[5] == "rbf":
                  # RBFs are distributed as external downloads; do not store large
                  # bitstreams in this repository.
                  external_lines.append(f"{dest},{selected[1]}")
                  continue
              downloads[dest] = selected[1]

          current_managed = set(downloads)
          # Remove only paths this workflow previously declared as managed.
          for stale in sorted(old_managed - current_managed):
              if not (stale.startswith("_Arcade/cores/") or stale.startswith("_Arcade/_Unofficial/") or stale.startswith("config/nvram/")):
                  raise RuntimeError(f"Unsafe stale path in sync manifest: {stale}")
              if os.path.isfile(stale):
                  os.remove(stale)
                  print(f"Removed stale managed file: {stale}")

          os.makedirs("_Arcade/cores", exist_ok=True)
          os.makedirs("config/nvram", exist_ok=True)
          with open("external_files.csv", "w", encoding="utf-8", newline="") as f:
              f.write("\n".join(external_lines) + ("\n" if external_lines else ""))
          with open("/tmp/download_files.txt", "w", encoding="utf-8") as f:
              for path, url in sorted(downloads.items()):
                  f.write(f"{path}|{url}\n")
          with open(old_manifest_path, "w", encoding="utf-8") as f:
              for path in sorted(current_managed):
                  f.write(path + "\n")

          print(f"Discovered {len(downloads)} managed core/MRA/NVM files.")
          print(f"Queued {len(external_lines)} upstream external archive entries.")
          PY

          while IFS='|' read -r local_path url; do
            [ -z "$local_path" ] && continue
            mkdir -p "$(dirname "$local_path")"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --output "$local_path" "$url"
          done < /tmp/download_files.txt

          if [ -f manual_external_files.csv ]; then
            cat manual_external_files.csv >> external_files.csv
          fi

      - name: Auto-discover MAME ROMs from MRA files
        run: |
          python3 << 'EOF'
          import os, json, time, xml.etree.ElementTree as ET
          from urllib.parse import quote
          from urllib.request import urlopen

          ARCHIVE_BASE = "https://archive.org/download/mame-roms-merged_/MAME%20ROMs%20%28merged%29"
          ARCHIVE_API = "https://archive.org/metadata/mame-roms-merged_/files/MAME%20ROMs%20%28merged%29"
          ONGO_ID = "OngoFiles"
          ONGO_BASE = f"https://archive.org/download/{ONGO_ID}"

          existing = set()
          with open('external_files.csv') as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith('#'):
                      parts = line.split(',')
                      if len(parts) >= 2:
                          existing.add(parts[0].lower())

          roms_needed = set()
          for root, dirs, files in os.walk('_Arcade'):
              for fname in files:
                  if fname.endswith('.mra'):
                      mra_path = os.path.join(root, fname)
                      try:
                          tree = ET.parse(mra_path)
                          root_elem = tree.getroot()
                          parent_elem = root_elem.find('parent')
                          setname_elem = root_elem.find('setname')
                          if parent_elem is not None and parent_elem.text:
                              parent_name = parent_elem.text.strip()
                              setname = setname_elem.text.strip() if setname_elem is not None and setname_elem.text else ''
                              if parent_name != setname:
                                  continue
                          for rom_elem in root_elem.iter('rom'):
                              zip_attr = rom_elem.get('zip')
                              if zip_attr:
                                  for z in zip_attr.split('|'):
                                      z = z.strip()
                                      if z:
                                          roms_needed.add(z)
                      except ET.ParseError:
                          pass

          print(f"Found {len(roms_needed)} unique ROMs referenced in MRA files.")

          new_roms = []
          for rom in sorted(roms_needed):
              local_path = f'games/mame/{rom}'
              if local_path.lower() not in existing:
                  new_roms.append(rom)

          print(f"{len(new_roms)} ROMs not yet in external_files.csv.")

          with open('missing_roms.csv', 'w') as f:
              pass

          found_roms = set()
          for path in existing:
              if path.startswith('games/mame/') and path.endswith('.zip'):
                  found_roms.add(path[len('games/mame/'):-4])

          print("Fetching OngoFiles collection list...")
          ongoing_file_map = {}
          try:
              with urlopen(f"https://archive.org/metadata/{ONGO_ID}/files", timeout=30) as resp:
                  data = json.loads(resp.read())
              result = data.get('result', [])
              for item in result:
                  name = item.get('name', '')
                  if name.endswith('.zip'):
                      filename = name.split('/')[-1].lower()
                      ongoing_file_map[filename] = (item.get('size'), item.get('md5'), name)
              print(f"  Loaded {len(ongoing_file_map)} .zip files from OngoFiles.")
          except Exception as e:
              print(f"  WARN: Could not fetch OngoFiles list: {e}")

          ia_cache = {}
          added = 0
          failed = 0

          for rom in new_roms:
              size, md5, url = None, None, None

              if rom in ia_cache:
                  size, md5 = ia_cache[rom]
                  if size:
                      url = f"{ARCHIVE_BASE}/{quote(rom)}"
              else:
                  api_url = f"{ARCHIVE_API}/{quote(rom)}"
                  try:
                      with urlopen(api_url, timeout=10) as resp:
                          data = json.loads(resp.read())
                      result = data.get('result', {})
                      size = result.get('size')
                      md5 = result.get('md5')
                      ia_cache[rom] = (size, md5)
                      if size:
                          url = f"{ARCHIVE_BASE}/{quote(rom)}"
                  except Exception:
                      size, md5 = None, None
                      ia_cache[rom] = (None, None)
                  time.sleep(0.1)

              if not size:
                  entry = ongoing_file_map.get(rom.lower())
                  if entry:
                      size, md5, full_path = entry
                      url = f"{ONGO_BASE}/{quote(full_path)}"
                      print(f"    (found in OngoFiles: {full_path})")

              if size and md5:
                  with open('external_files.csv', 'a') as f:
                      f.write(f"games/mame/{rom},{url},{size},{md5}\n")
                  added += 1
                  found_roms.add(rom[:-4])
                  print(f"  + {rom}")
              else:
                  rom_base = rom[:-4]
                  is_child = False
                  for found in found_roms:
                      if rom_base.startswith(found) and len(rom_base) > len(found):
                          is_child = True
                          break
                  if is_child:
                      print(f"  - {rom} (variant of {found}.zip, skipping)")
                  else:
                      failed += 1
                      with open('missing_roms.csv', 'a') as f:
                          f.write(f"{rom}\n")
                      print(f"  ! {rom} (not found)")

          print(f"\nAdded {added} ROMs, {failed} missing.")

          seen = set()
          deduped = []
          with open('external_files.csv') as f:
              for line in f:
                  line = line.rstrip('\n')
                  if not line or line.startswith('#'):
                      deduped.append(line)
                      continue
                  key = line.split(',')[0].lower()
                  if key not in seen:
                      seen.add(key)
                      deduped.append(line)
                  else:
                      print(f"  (dedup: {key})")
          with open('external_files.csv', 'w') as f:
              f.write('\n'.join(deduped) + '\n')
          EOF

      - name: Enrich missing hashes and sizes
        run: |
          python3 << 'EOF'
          import json, os, sys, time, hashlib, tempfile
          from urllib.parse import quote, urlparse
          from urllib.request import urlopen

          def get_ia_metadata(url):
              parsed = urlparse(url)
              parts = parsed.path.split('/', 2)
              if len(parts) < 3:
                  return None, None
              remainder = parts[2]
              if '/' not in remainder:
                  return None, None
              idx = remainder.index('/')
              identifier = remainder[:idx]
              file_path = remainder[idx+1:]
              api_url = f"https://archive.org/metadata/{identifier}/files/{quote(file_path, safe='/')}"
              try:
                  with urlopen(api_url, timeout=10) as resp:
                      data = json.loads(resp.read())
                  result = data.get('result', {})
                  return result.get('size'), result.get('md5')
              except Exception:
                  return None, None

          def get_file_metadata(url):
              try:
                  tmp = tempfile.NamedTemporaryFile(delete=False)
                  with urlopen(url, timeout=30) as resp:
                      while True:
                          chunk = resp.read(65536)
                          if not chunk:
                              break
                          tmp.write(chunk)
                  tmp.close()
                  with open(tmp.name, 'rb') as f:
                      data = f.read()
                  os.unlink(tmp.name)
                  return str(len(data)), hashlib.md5(data).hexdigest()
              except Exception:
                  return None, None

          infile = 'external_files.csv'
          out_lines = []
          enriched = 0
          failed = 0

          with open(infile) as f:
              for line in f:
                  line = line.rstrip('\n')
                  if not line or line.startswith('#'):
                      out_lines.append(line)
                      continue
                  parts = line.split(',')
                  if len(parts) >= 4 and parts[2] and parts[3]:
                      out_lines.append(line)
                      continue
                  if len(parts) < 2:
                      out_lines.append(line)
                      continue
                  path, url = parts[0], parts[1]
                  size, md5 = None, None
                  if 'archive.org' in url:
                      size, md5 = get_ia_metadata(url)
                      time.sleep(0.2)
                  if not size:
                      size, md5 = get_file_metadata(url)
                  if size and md5:
                      out_lines.append(f"{path},{url},{size},{md5}")
                      enriched += 1
                  else:
                      out_lines.append(line)
                      failed += 1

          with open(infile, 'w') as f:
              f.write('\n'.join(out_lines) + '\n')

          print(f"Enriched {enriched} entries, {failed} failed.")
          EOF

      - name: Commit and trigger build
        id: commit_and_trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add external_files.csv
          git add sync_manifest.txt
          git add missing_roms.csv 2>/dev/null || true
          git add _Arcade/ 2>/dev/null || true
          git add _Console/ 2>/dev/null || true
          git add config/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to sync. Skipping build_db."
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync: updated external_files.csv and core files"
            git push
            echo "should_trigger=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger build_db workflow
        if: steps.commit_and_trigger.outputs.should_trigger == 'true'
        run: |
          gh workflow run "Build Custom Database" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
